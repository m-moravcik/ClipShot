name: ClipShot
options:
  bundleIdPrefix: sk.moravcik
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # The committed Package.resolved pins Sparkle's revision (the tag alone could be
  # moved upstream); every generated project gets it, and release builds resolve
  # only from it (scripts/release-signed.sh). `make guards` keeps it in step with
  # the exactVersion below.
  postGenCommand: mkdir -p ClipShot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Package.resolved ClipShot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.9.3"
    CURRENT_PROJECT_VERSION: "4"
    ARCHS: "$(ARCHS_STANDARD)"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Required for notarization; see VibeRes for the rationale.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      # Hardened runtime enables library validation, which refuses the
      # ad-hoc-signed Sparkle.framework in local builds.
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Coverage instrumentation injects get-task-allow, which notarization rejects.
      ENABLE_CODE_COVERAGE: NO
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Gates the Sparkle call sites; the framework is embedded in every configuration.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENABLE_SPARKLE"
      ONLY_ACTIVE_ARCH: NO

schemes:
  ClipShot:
    build:
      targets:
        ClipShot: all
        ClipShotTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - ClipShot
      targets:
        - ClipShotTests

  # `make cli`: the command line tool on its own (it is also built into the app).
  clipshot-cli:
    build:
      targets:
        clipshot-cli: all

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Pinned exactly: an updater is the one dependency whose compromise is
    # arbitrary code execution. 2.10.0 is outside the known advisory ranges.
    exactVersion: 2.10.0

targets:
  ClipShot:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ClipShot
    info:
      path: ClipShot/Info.plist
      properties:
        CFBundleDisplayName: ClipShot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Michal Moravčík. MIT License."
        CFBundleLocalizations: [en, sk, cs, de, es, fr]
        CFBundleAllowMixedLocalizations: true
        NSDesktopFolderUsageDescription: "ClipShot watches your screenshot folder to copy new screenshots to the clipboard and, if you turn it on, to move old screenshots to the Trash."
        NSDocumentsFolderUsageDescription: "ClipShot watches your screenshot folder to copy new screenshots to the clipboard and, if you turn it on, to move old screenshots to the Trash."
        NSDownloadsFolderUsageDescription: "ClipShot watches your screenshot folder to copy new screenshots to the clipboard and, if you turn it on, to move old screenshots to the Trash."
        NSRemovableVolumesUsageDescription: "ClipShot watches your screenshot folder to copy new screenshots to the clipboard and, if you turn it on, to move old screenshots to the Trash."
        NSNetworkVolumesUsageDescription: "ClipShot watches your screenshot folder to copy new screenshots to the clipboard and, if you turn it on, to move old screenshots to the Trash."
        SUFeedURL: https://raw.githubusercontent.com/m-moravcik/ClipShot/main/appcast.xml
        SUPublicEDKey: ciayVzrfVUd/AHaU8EB8T7xsMfathzO3rKMGxHK1xEk=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    dependencies:
      - package: Sparkle
      # `clipshot` ships inside the app, at Contents/Helpers/clipshot: signed and notarized
      # with it, always the app's version. Not Contents/MacOS: on a case-insensitive volume
      # `clipshot` there is the app's own `ClipShot` executable.
      - target: clipshot-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.ClipShot
        PRODUCT_NAME: ClipShot
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.ClipShot.debug

  ClipShotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ClipShotTests
        excludes:
          - "Fixtures/**"
    dependencies:
      - target: ClipShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.ClipShotTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - ClipShotTests
      gatherCoverageData: true

  # The command line tool (Addendum C). It compiles the app's Core and Control sources, not a
  # copy of them, and no UI.
  clipshot-cli:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    productName: clipshot
    sources:
      - path: ClipShot/Core
        # Peg's frame clock times its moments with the app's design tokens.
        excludes:
          - PegFlash.swift
      - path: ClipShot/Control
      - path: ClipShotCLI
    settings:
      base:
        PRODUCT_NAME: clipshot
        # The executable is `clipshot`; the module is not. Both products land in the same
        # directory, and on a case-insensitive volume a `clipshot.swiftmodule` next to
        # `ClipShot.swiftmodule` would make the tests' `@testable import ClipShot` find the tool.
        PRODUCT_MODULE_NAME: ClipShotCLI
        PRODUCT_BUNDLE_IDENTIFIER: sk.moravcik.ClipShot.cli
        # `clipshot --version` reads CFBundleShortVersionString (MARKETING_VERSION) from an
        # Info.plist embedded in the binary, so it is right wherever the binary is linked from.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
